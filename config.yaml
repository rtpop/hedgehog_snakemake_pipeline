##------------##
## Containers ##
##------------##
python_container: "docker://rtpop/hedgehog-run:1.8"
r_container: "docker://rtpop/hedgehog-downstream:1.0"

##-------------##
## Directories ##
##-------------##  
data_dir: "data"
output_dir: "output/new" # this will be a parent directory for different runs
src_dir: "src/new"
ncores: 10

# list of tissues
tissue: ["Adipose_subcutaneous", "Adipose_visceral", "Adrenal_gland", "Artery_aorta",
  "Artery_coronary", "Artery_tibial", "Brain_basal_ganglia", "Brain_cerebellum", "Brain_other",
  "Breast", "Colon_sigmoid", "Colon_transverse", "Esophagus_mucosa", "Esophagus_muscularis",
  "Heart_atrial_appendage","Heart_left_ventricle", "Intestine_terminal_ileum",
  "Kidney_cortex", "Liver", "Lung", "Minor_salivary_gland", "Ovary", "Pancreas", "Pituitary",
  "Prostate", "Skin", "Spleen","Stomach", "Testis", "Thyroid", "Tibial_nerve","Uterus", "Vagina", "Whole_blood"]
#tissue: ["Artery_aorta", "Artery_coronary", "Artery_tibial"]

## Delimiter
delimiter: ","

## ------------------------------ ##
## Download and process GTEx data ##
## ------------------------------ ##
gtex_data_file: "GTEx_PANDA_net.RData"
processing_log: "process_gtex.log"
motif_prior: "motif_prior.txt"

##-------------------------------------##
## Filtering PANDA network for BiHiDef ##
##-------------------------------------##
panda_net_file: "panda_network_edgelist.txt"
panda_net_filtered_file: "panda_network_filtered_edgelist.txt"
filtering_method: "both" # options: prior, hedgehog, both; note that you must set the filtering for bihidef separately (see below).

## ------------------- ##
## Filtering benchmark ##
## ------------------- ##
benchmark: true
bench_resolution: [0.1, 0.5, 1, 5, 10] # resolution parameter for the BRIM algorithm to calculate modularity
plot_unfiltered: False # whether to plot the unfiltered networks in the benchmark

## ----------- ##
## Run bihidef ##
## ----------- ##
max_communities: 3 # multiplier for the maximum number of communities passed to condor
max_resolution: 5 # the maximum resolution parameter for bihidef
min_resolution: 0.001 # the minimum resolution parameter for bihidef (not used in the snakemake atm)
resolution_step: 0.001 # the step size for the resolution parameter (not used in the snakemake atm)
target_tag: "gene"
regulator_tag: "TF"
filtering_bihidef: "prior" # options: prior, hedgehog; BiHiDef does not support both filtering methods at the same time. It is recommended to use the benchmarking to determine a filtering method for BiHiDef.
# the minimum and maximum number of genes in a community
min_genes: 10
max_genes: 200

## ------------------------ ##
## GO enrichment parameters ##
## ------------------------ ##
# Human gene symbols and BP ontology are used.
# Keep false to derive the background from ALL targets in each unfiltered PANDA
# network. No external annotation.txt is required. True uses only selected GMT genes.
auto_bg: false
save_all: true
sig_thresh: 0.05
statistic: "fisher"
algorithm: "classic"
go_results: "go_enrichment_results_bug_fix_q_score.txt"
go_enrichment_plot: "go_enrichment_counts.pdf" # One overall plot under output_dir

## ----------------------------- ##
## Community consolidation      ##
## ----------------------------- ##
# Paths relative to output_dir. These outputs always run through rule all.
community_stats_consolidated: "community_stats_consolidated.tsv"
community_tissue_summary: "community_tissue_summary.tsv"
community_plot: "community_counts.pdf"

## ----------------------------- ##
## Jaccard boxplot              ##
## ----------------------------- ##
# Compare final selected HEDGEHOG communities, using all community pairs.
# These tissues must also be present in the tissue list above.
jaccard_boxplot_tissues: ["Artery_aorta", "Artery_coronary", "Brain_cerebellum"]
jaccard_boxplot_min_jaccard: 0.2
jaccard_boxplot: "jaccard_boxplot_selected_communities.pdf" # Relative to output_dir

## ----------------------------- ##
## Existing Leiden comparison  ##
## ----------------------------- ##
# Uses src/run_leiden.py; included in rule all when benchmark is true.
# CONDOR runs first on prior-filtered PANDA networks, followed by run_leiden.py.
leiden_resolutions: [1.25, 1.5, 1.75]
leiden_condor_resolutions: [1.25, 1.5, 1.75]
leiden_condor_membership_dir: "{tissue_type}/condor_output" # Relative to leiden_benchmark/
# run_condor writes target/regulator memberships and selected community files here.
# Results go under <output_dir>/leiden_benchmark/.
# The selected container must include pandas, scipy, igraph and leidenalg.
# Set leiden_container to your image URI if python_container lacks these packages.
